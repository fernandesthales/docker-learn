services:
  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: tasks_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tester -d tasks_test']
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    image: ${TEST_IMAGE:-task-api:2.0.0}
    environment:
      APP_ENV: test
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      PUBLIC_ORIGIN: http://test.local
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgres://tester:testpassword@db-test:5432/tasks_test
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./test:/app/test:ro
    command: ['node', '--test', 'test/api.test.js', 'test/auth.test.js']
    healthcheck:
      disable: true
