# Separate project: docker compose -p taskroom-local -f compose.local.yaml up --build -d
services:
  app:
    build: .
    ports: ['127.0.0.1:3010:3000']
    environment:
      APP_ENV: local
      SESSION_SECRET: local-only-session-secret-at-least-32-characters
      PUBLIC_ORIGIN: http://127.0.0.1:3010,http://localhost:3010,http://127.0.0.1:5173,http://localhost:5173
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgres://app:localpassword@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: tasks
    volumes: ['local-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d tasks']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  local-data:
