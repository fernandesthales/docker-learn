services:
  dev:
    image: task-api:1.3.0
    ports:
      - "3001:3000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://app:devpassword@db-dev:5432/tasks
    depends_on:
      db-dev:
        condition: service_healthy

  db-dev:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tasks
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  stage:
    image: task-api:1.2.0
    ports:
      - "3002:3000"
    environment:
      APP_ENV: stage

volumes:
  dev-db-data: